<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KGBC - 대한민국 한우의 미래" />
    <meta name="theme-color" content="#9e0810" />
    <title>KGBC</title>
    <!-- 파비콘: SVG(모던 브라우저) → ICO(구형 브라우저·탭) → apple-touch-icon(iOS 홈 화면).
         원본은 public/favicon.svg 이고, ICO/PNG 는 `node scripts/make-favicon.cjs public` 로 굽습니다. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="KGBC" />
    <!-- Google Material Symbols — 현재는 '맨 위로' 버튼 아이콘만 필요해 arrow_upward만 서브셋(약 2KB)으로 받습니다.
         아이콘을 더 쓸 때는 icon_names에 이름을 쉼표로 추가하세요. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0&amp;icon_names=arrow_upward"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
